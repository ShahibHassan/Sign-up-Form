<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sign-up Form</title>
</head>
<body>
    <div class="container">
        <div id="left-section">
            <img class="background" src="/images/image.avif" alt="">
            <div id="logo-container">
                <img class = 'logo' src="images/Odin-Logo.png" alt="">
                <h1>ODIN</h1>
            </div>
            <div id="photo-credit"><p>Photo by <a class = "link" target="_blank" rel="noopener noreferrer" href="https://unsplash.com/@haliewestphoto">Halie West</a> on <a class="link" target="_blank" rel="noopener noreferrer" href="https://unsplash.com/">Unsplash</a></p></div>
        </div>
        <div id="right-section">
            <div id="introduction">
                <p>This is not a real online service! You know you need something like this in your life to realise your deepest dreams. Sign up <i>now</i> to get started. <br><br>You <i>know</i> you want to.
                </p>
            </div>
            <div id="signup">
                <h3>Let's do this!</h3>
                <form action="#">
                    <div class="form-container">
                        <div class="form-group">
                            <label for="first_name">FIRST NAME</label>
                            <input type="text" id="first_name" name="first_name">

                            <label for="email">EMAIL</label>
                            <input type="email" name="email" id="email">

                            <label for="password">PASSWORD</label>
                            <input type="password" name="password" id="password" minlength="8">
                        </div>
                        <div class="form-group">
                            <label for="las_name">LAST NAME</label>
                            <input type="text" id="last_name" name="last_name">

                            <label for="phone_number">PHONE NUMBER</label>
                            <input type="tel" name="phone_number" id="phone_number" min="8">

                            <label for="confirm_password">CONFIRM PASSWORD</label>
                            <input type="password" name="confirm_password" id="confirm_password" minlength="8">
                        </div>
                    </div>
                </form>
            </div>
                
            
            <div id="submit">
                <button type="submit" name="create_account" id ="create-account">Create Account</button>
                <p>Already have an account? <a href="#">Log in</a></p>
            </div>
        </div>

        </div>
    </div>
</body>
</html>
